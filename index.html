<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Paletas de Colores Accesible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Generador de Paletas</h1>
        <div class="controles">
            <div class="control-group">
                <label for="cantidad">Tamaño de paleta:</label>
                <select id="cantidad">
                    <option value="6">6 Colores</option>
                    <option value="8" selected>8 Colores</option>
                    <option value="9">9 Colores</option>
                </select>
            </div>

            <div class="control-group">
                <label for="formato">Formato secundario:</label>
                <select id="formato">
                    <option value="HEX">HEX</option>
                    <option value="RGBA">RGBA</option>
                </select>
            </div>

            <button id="btn-generar">Generar Paleta</button>
        </div>
    </header> 
    
    <!-- Contenedor principal semántico -->
    <main>
        <section id="contenedor-paleta" aria-label="Paleta de colores generada"></section>
    </main>

    <!-- Zona invisible para que los lectores de pantalla "escuchen" las notificaciones -->
    <div id="live-region" class="sr-only" aria-live="polite"></div>

    <script src="script.js" defer></script>  
</body>
</html>
